name: migrar
on:
  push:
    branches: [main]
    paths: ['migrations/**']

permissions:
  contents: read

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: npx --yes wrangler d1 migrations apply avaliacao-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - run: npm install -g @github/copilot

      - name: Monta prompt do resumo
        run: |
          { echo "Resuma em português, em até 5 itens, o que estas migrações D1 mudaram no banco."
            for f in $(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- migrations/); do
              echo "--- $f"; cat "$f"
            done
          } > resumo.txt

      - id: resumo
        uses: actions/ai-inference@v3
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          model: auto
          prompt-file: resumo.txt

      - name: Escreve no resumo da execução
        run: |
          echo "## Migrações aplicadas" >> "$GITHUB_STEP_SUMMARY"
          cat "${{ steps.resumo.outputs.response-file }}" >> "$GITHUB_STEP_SUMMARY"
